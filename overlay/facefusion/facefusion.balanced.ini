; Steam Deck — BALANCED (recommended)
; Fixes: mouth/expression via expression_restorer; stable track via selector=one

[paths]
temp_path =
jobs_path =
source_paths =
target_path =
output_path =

[patterns]
source_pattern =
target_pattern =
output_pattern =

[face_detector]
face_detector_model = yolo_face
face_detector_size = 640x640
face_detector_margin = 0 0 0 0
; detect slightly tilted heads without full 4-angle cost
face_detector_angles = 0 90
face_detector_score = 0.4

[face_landmarker]
; 2dfan4 = better mouth/jaw landmarks than peppa_wutz
face_landmarker_model = 2dfan4
face_landmarker_score = 0.4

[face_selector]
; one = no "swap / original" flicker when pose changes (single person)
; multi-person video: set reference + raise reference_face_distance
face_selector_mode = one
face_selector_order = large-small
face_selector_age_start =
face_selector_age_end =
face_selector_gender =
face_selector_race =
reference_face_position = 0
reference_face_distance = 0.55
reference_frame_number = 0

[face_masker]
face_occluder_model = xseg_1
face_parser_model = bisenet_resnet_18
face_mask_types = box
face_mask_areas =
face_mask_regions =
face_mask_blur = 0.35
face_mask_padding = 0 0 0 0

[voice_extractor]
voice_extractor_model = kim_vocal_2

[frame_extraction]
trim_frame_start =
trim_frame_end =
temp_frame_format = png
keep_temp =

[output_creation]
output_image_quality = 80
output_image_scale = 1.0
output_audio_encoder =
output_audio_quality = 80
output_audio_volume = 100
output_video_encoder = libx264
output_video_preset = veryfast
output_video_quality = 75
output_video_scale = 1.0
output_video_fps =

[processors]
; expression_restorer pulls mouth/eyes motion from the TARGET video onto the swapped face
processors = face_swapper expression_restorer
age_modifier_model =
age_modifier_direction =
background_remover_model =
background_remover_fill_color =
background_remover_despill_color =
deep_swapper_model =
deep_swapper_morph =
expression_restorer_model = live_portrait
expression_restorer_factor = 85
expression_restorer_areas = upper-face lower-face
face_debugger_items =
face_editor_model =
face_editor_eyebrow_direction =
face_editor_eye_gaze_horizontal =
face_editor_eye_gaze_vertical =
face_editor_eye_open_ratio =
face_editor_lip_open_ratio =
face_editor_mouth_grim =
face_editor_mouth_pout =
face_editor_mouth_purse =
face_editor_mouth_smile =
face_editor_mouth_position_horizontal =
face_editor_mouth_position_vertical =
face_editor_head_pitch =
face_editor_head_yaw =
face_editor_head_roll =
face_enhancer_model = gfpgan_1.4
face_enhancer_blend = 80
face_enhancer_weight =
face_swapper_model = inswapper_128_fp16
face_swapper_pixel_boost = 256x256
face_swapper_weight = 0.5
frame_colorizer_model =
frame_colorizer_size =
frame_colorizer_blend =
frame_enhancer_model =
frame_enhancer_blend =
lip_syncer_model =
lip_syncer_weight =

[uis]
open_browser =
ui_layouts = default
ui_workflow = instant_runner

[download]
download_providers =
download_scope = lite

[benchmark]
benchmark_mode =
benchmark_resolutions = 240p 360p 540p
benchmark_cycle_count = 3

[execution]
execution_device_ids = 0
execution_providers = directml
execution_thread_count = 2

[memory]
video_memory_strategy = strict
system_memory_limit = 8

[misc]
log_level = info
halt_on_error =
